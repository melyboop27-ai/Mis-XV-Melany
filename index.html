<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f8dfe5">
  <title>Mis XV años Melany</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: #f8dfe5;
      font-family: Georgia, "Times New Roman", serif;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      box-sizing: border-box;
    }
    .card {
      width: 100%;
      max-width: 520px;
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 12px 35px rgba(96, 55, 66, 0.22);
      background: white;
    }
    img {
      display: block;
      width: 100%;
      height: auto;
    }
  </style>
</head>
<body>
  <main class="card">
    <img src="invitacion-melany.png" alt="Mis XV años Melany">
  </main>
</body>
</html>
